<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon" />
    <title>PipeDreamers Jamulus Control</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: url(/static/jambetter_bg.jpg) center 80%/cover no-repeat fixed;
            font-family: Arial, sans-serif;
        }
        .appHeader { margin: -4px -4px 14px -4px; }
        .appLogo { width: 100%; max-height: 220px; object-fit: contain;border-radius: 10px; display:block; }

        .header-actions {
            display: flex;
            justify-content: flex-end;
            margin: 6px 0 10px 0;
        }

        .support-widget {
            position: fixed;
            right: 16px;
            bottom: 16px;
            width: 340px;
            max-width: calc(100vw - 24px);
            max-height: 72vh;
            background: rgba(20,20,20,0.95);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            z-index: 120;
            box-shadow: 0 12px 30px rgba(0,0,0,0.35);
            display: none;
            flex-direction: column;
        }
        .support-widget.open { display: flex; }
        .support-head { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.18); display:flex; justify-content:space-between; align-items:center; }
        .support-body { padding: 10px 12px; overflow:auto; }
        .support-actions { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
        .support-log { font-size: 13px; line-height: 1.35; max-height: 220px; overflow:auto; background: rgba(0,0,0,0.25); border-radius:6px; padding:8px; }
        .support-input { display:flex; gap:6px; margin-top:8px; }
        .support-input input { flex:1; }
        
        .container {
            position: relative;
            z-index: 50;
            background: rgba(0,0,0,0.22);
            color: #fff;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            max-width: 900px;
            width: calc(100% - 40px);
            margin: 260px auto 20px auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.18); 
            border: 1px solid rgba(255,255,255,0.18);
        }
        
        .btn { margin: 2px; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .btn-success { background-color: #5cb85c; color: white; }
        .btn-danger { background-color: #d9534f; color: white; }
        .btn-warning { background-color: #f0ad4e; color: white; }
        .btn-info { background-color: #5bc0de; color: white; }
        .btn-sm { font-size: 0.85em; padding: 6px 12px; }
        
        h2 { margin-top: 0; border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 10px; }
        h3 { margin: 15px 0 10px 0; font-size: 16px; }
        
        .section {
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        
        input[type="text"], input[type="number"] {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 14px;
        }
        
        .slider-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 5px 0;
        }
        
        input[type="range"] {
            flex: 1;
            max-width: 200px;
        }
        
        .status-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin: 10px 0;
        }
        
        .status-item {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 13px;
        }
        
        .file-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
            padding: 6px 10px;
            background: rgba(0,0,0,0.15);
            border-radius: 4px;
        }
        
        .file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        .file-actions { display: flex; gap: 5px; }
        
        .browser-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .upload-section { display: flex; align-items: center; gap: 8px; }
        
        #wavFiles { 
            max-height: 300px; 
            overflow-y: auto; 
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            padding: 8px;
            background: rgba(0,0,0,0.1);
            min-height: 50px;
        }
        #wavFiles:empty::before {
            content: "Loading files...";
            color: rgba(255,255,255,0.5);
            font-style: italic;
        }
        
        /* Flashing red for loading state */
        @keyframes flash-red {
            0%, 100% { background-color: #d9534f; }
            50% { background-color: #ff6b6b; }
        }
        .btn-loading {
            animation: flash-red 1s infinite;
            color: white !important;
        }
        
        .nav-left { display: flex; gap: 5px; }
        
        .help-tooltip {
            cursor: help;
            font-size: 16px;
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        .help-tooltip:hover {
            opacity: 1;
        }
        
        @media (max-width: 600px) {
            body {
                /* "fixed" backgrounds can be janky on mobile */
                background-attachment: scroll;
            }

            .container {
                margin: 120px auto 12px auto;
                width: calc(100% - 24px);
                padding: 14px;
            }

            .appLogo {
                max-height: 140px;
            }

            .input-group {
                flex-direction: column;
                align-items: stretch;
            }

            .slider-group {
                flex-wrap: wrap;
                align-items: center;
            }

            input[type="text"],
            input[type="number"] {
                width: 100%;
                box-sizing: border-box;
            }

            input[type="range"] {
                max-width: none;
                width: 100%;
            }

            .btn {
                font-size: 16px;
                padding: 12px 16px;
            }

            .status-row {
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="appHeader">
            <img class="appLogo" src="/static/pipedreamers_logo.jpg" alt="PipeDreamers">
        </div>

        <div class="header-actions">
            <button id="supportBtn" class="btn btn-info" onclick="toggleSupportPanel()">💬 Support</button>
        </div>

        <!-- SESSION & RECORDING -->
        <div class="section">
            <h2>🎙️ Session & Recording</h2>
            <div class="input-group">
                <label><b>Session Name:</b></label>
                <input type="text" id="sessionNameInput" placeholder="Enter name before recording" style="flex:1;min-width:200px;">
                <button id="recordToggleBtn" class="btn btn-success" onclick="toggleRecording()">Start Recording</button>
                <span class="help-tooltip" title="If a backing track is selected, it will automatically play when you start recording">❓</span>
                <button class="btn btn-warning" onclick="restartBotJamulus()">Restart Bot</button>
            </div>
            <div class="status-row">
                <span id="recStatus" class="status-item" style="background:#777;">Recording: OFF</span>
                <span id="jamStatus" class="status-item" style="background:#777;">Jamulus Server: Unknown</span>
            </div>
        </div>

        <!-- METRONOME -->
        <div class="section">
            <h3>🥁 Metronome (everyone hears it)</h3>
            <div class="slider-group">
                <label>BPM: <span id="bpmVal">100</span></label>
                <input type="range" id="metroBpm" min="40" max="200" value="100" oninput="document.getElementById('bpmVal').textContent=this.value; scheduleMetronomeUpdate();">
                <label>Vol: <span id="volVal">80</span>%</label>
                <input type="range" id="metroVol" min="0" max="100" value="80" oninput="document.getElementById('volVal').textContent=this.value; scheduleMetronomeUpdate();">
                <button id="metroToggleBtn" class="btn btn-success" onclick="toggleMetronome()">Start</button>
            </div>
        </div>

        <!-- BACKING TRACK -->
        <div class="section">
            <h3>🎵 Backing Track</h3>
            <div class="input-group">
                <label><b>Selected:</b></label>
                <code id="queuedWavDisplay" style="flex:1;">(none)</code>
                <button id="playToggleBtn" class="btn btn-success" onclick="togglePlayback()">Play Track</button>
                <button class="btn btn-info" onclick="restartTrack()">Restart Track</button>
                <button class="btn btn-warning" onclick="clearQueuedWav()">Clear Track</button>
            </div>
            
            <div id="wavBrowser" style="margin-top:15px;">
                <div class="browser-header">
                    <div><b>Browse:</b> <code id="wavPath">recordings/</code></div>
                    <div class="nav-left">
                        <button class="btn btn-sm" onclick="wavUp()">Up</button>
                        <button class="btn btn-sm" onclick="wavRefresh()">Refresh</button>
                        <button class="btn btn-sm btn-info" onclick="downloadCurrentFolder()">Download Folder ZIP</button>
                    </div>
                    <div class="upload-section" style="flex-direction:column;align-items:flex-end;">
                        <div id="uploadFileName" style="font-size:12px;color:rgba(255,255,255,0.8);margin-bottom:4px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">No file selected</div>
                        <div style="display:flex;gap:8px;align-items:center;">
                            <label class="btn btn-sm" style="position:relative;overflow:hidden;cursor:pointer;margin:0;">
                                Choose File
                                <input type="file" id="tmpTrackUploadInput" accept="audio/*" style="position:absolute;left:-9999px;" onchange="document.getElementById('uploadFileName').textContent=this.files[0]?this.files[0].name:'No file selected'">
                            </label>
                            <span class="help-tooltip" title="Upload your own backing track here. It will appear in the temp folder below.">❓</span>
                            <button class="btn btn-sm btn-success" onclick="tmpTrackUpload()">Temp Upload (24h)</button>
                        </div>
                    </div>
                </div>
                <div id="wavFiles"></div>
            </div>
        </div>

    </div>


    <div id="supportWidget" class="support-widget" aria-live="polite">
        <div class="support-head">
            <b>JamBetter Support</b>
            <button class="btn btn-sm" onclick="toggleSupportPanel(false)">Close</button>
        </div>
        <div class="support-body">
            <div style="font-size:12px;opacity:0.85;margin-bottom:8px;">Server: <code id="supportServerBadge"></code></div>
            <div class="support-actions">
                <button class="btn btn-sm btn-info" onclick="supportQuick('status')">Check Status</button>
                <button class="btn btn-sm btn-warning" onclick="supportQuick('restart')">Request Restart</button>
                <button class="btn btn-sm" onclick="supportQuick('troubleshoot')">Troubleshoot</button>
                <button class="btn btn-sm btn-danger" onclick="supportQuick('escalate')">Escalate</button>
            </div>
            <div id="supportLog" class="support-log"></div>
            <div class="support-input">
                <input id="supportText" type="text" placeholder="Describe your issue..." />
                <button class="btn btn-sm btn-success" onclick="supportSendText()">Send</button>
            </div>
        </div>
    </div>

    <script>
        // State

        const SUPPORT_BOT_URL = {{ (support_bot_url or '')|tojson }};
        const SUPPORT_SERVER_ID = {{ (support_server_id or '')|tojson }};
        let supportToken = null;

        function supportLog(line) {
            const el = document.getElementById('supportLog');
            if (!el) return;
            const ts = new Date().toLocaleTimeString();
            el.innerHTML += `<div><span style="opacity:.7">[${ts}]</span> ${line}</div>`;
            el.scrollTop = el.scrollHeight;
        }

        async function ensureSupportSession() {
            if (supportToken) return supportToken;
            const room = (document.getElementById('sessionNameInput')?.value || '').trim();
            const res = await fetch('/api/support/session', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ customer_id: 'web-customer', server_id: SUPPORT_SERVER_ID, room_name: room })
            });
            const data = await res.json();
            if (data.ok) supportToken = data.token;
            return supportToken;
        }

        async function supportQuick(intent) {
            try {
                await ensureSupportSession();
                const res = await fetch('/api/support/message', {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ token: supportToken, intent })
                });
                const data = await res.json();
                supportLog(data.message || 'No response');
            } catch (e) {
                supportLog('Support error: ' + e);
            }
        }

        async function supportSendText() {
            const input = document.getElementById('supportText');
            const text = (input?.value || '').trim();
            if (!text) return;
            supportLog('You: ' + text);
            input.value = '';
            try {
                await ensureSupportSession();
                const res = await fetch('/api/support/message', {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ token: supportToken, text })
                });
                const data = await res.json();
                supportLog(data.message || 'No response');
            } catch (e) {
                supportLog('Support error: ' + e);
            }
        }

        function toggleSupportPanel(forceOpen) {
            const panel = document.getElementById('supportWidget');
            const wantOpen = (typeof forceOpen === 'boolean') ? forceOpen : !panel.classList.contains('open');
            panel.classList.toggle('open', wantOpen);
            document.getElementById('supportServerBadge').textContent = SUPPORT_SERVER_ID || 'unknown';
            if (wantOpen && !document.getElementById('supportLog').innerHTML) {
                supportLog('Support is ready. Choose an action or describe your issue.');
            }
        }

            const room = (document.getElementById('sessionNameInput')?.value || '').trim();
            try {
                // Telegram deep-link handling
                if (/^https?:\/\/t\.me\//i.test(SUPPORT_BOT_URL)) {
                    const token = `server=${SUPPORT_SERVER_ID || ''};room=${room || ''}`;
                    const base = SUPPORT_BOT_URL.split('?')[0];
                    const target = `${base}?start=${encodeURIComponent(token)}`;
                    window.open(target, '_blank', 'noopener');
                    return;
                }
                const u = new URL(SUPPORT_BOT_URL, window.location.origin);
                if (SUPPORT_SERVER_ID) u.searchParams.set('server_id', SUPPORT_SERVER_ID);
                if (room) u.searchParams.set('room', room);
                u.searchParams.set('source', 'webapp');
                window.open(u.toString(), '_blank', 'noopener');
            } catch (e) {
                window.open(SUPPORT_BOT_URL, '_blank', 'noopener');
            }
        }
        let recordingState = "OFF";
        let metronomeRunning = false;
        let playbackRunning = false;
        let wavCurrentPath = "recordings/";
        
        // Simple API fetch
        async function apiFetch(url, opts) {
            return fetch(url, opts || {});
        }
        
        function setBusy(btn, busy, label) {
            if (!btn) return;
            if (busy) {
                btn.dataset._oldText = btn.textContent;
                btn.classList.add('busy');
                if (label) btn.textContent = label;
            } else {
                btn.classList.remove('busy');
                if (btn.dataset._oldText) btn.textContent = btn.dataset._oldText;
            }
        }

        // Recording
        async function toggleRecording() {
            const btn = document.getElementById("recordToggleBtn");
            const nameInput = document.getElementById("sessionNameInput");
            const name = nameInput.value.trim();
            const isStarting = btn.textContent.trim().toLowerCase().includes("start");
            
            if (isStarting && !name) {
                alert('Please enter a session name before recording.');
                nameInput.focus();
                nameInput.style.border = '2px solid #f0ad4e';
                setTimeout(() => nameInput.style.border = '', 2000);
                return;
            }
            
            try {
                const res = await apiFetch("/toggle-recording", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ session_name: name, action: isStarting ? "start" : "stop" })
                });

                if (!res.ok) {
                    alert(await res.text() || "Failed to toggle recording");
                } else {
                    if (isStarting) {
                        try { await apiFetch('/wav/play-queued', { method: 'POST' }); } catch (e) {}
                    } else {
                        try { await apiFetch('/wav/stop', { method: 'POST' }); } catch (e) {}
                    }
                    updateRecordingButton(isStarting ? "ON" : "OFF");
                }
            } catch (err) {
                alert("Request error.");
            }
        }

        function updateRecordingButton(state) {
            recordingState = state;
            const btn = document.getElementById("recordToggleBtn");
            const status = document.getElementById("recStatus");
            if (state === "ON") {
                btn.textContent = "Stop Recording";
                btn.className = "btn btn-danger";
                status.textContent = "Recording: ON";
                status.style.background = "#d9534f";
            } else {
                btn.textContent = "Start Recording";
                btn.className = "btn btn-success";
                status.textContent = "Recording: OFF";
                status.style.background = "#777";
            }
        }

        // Metronome
        function getMetronomeParams() {
            return {
                bpm: parseInt(document.getElementById('metroBpm').value || '100', 10),
                vol: parseInt(document.getElementById('metroVol').value || '80', 10) / 100.0
            };
        }

        let metroUpdateTimer = null;
        async function scheduleMetronomeUpdate() {
            if (!metronomeRunning) return;
            if (metroUpdateTimer) clearTimeout(metroUpdateTimer);
            metroUpdateTimer = setTimeout(async () => {
                const { bpm, vol } = getMetronomeParams();
                try {
                    await apiFetch('/metronome/start', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ bpm, vol })
                    });
                } catch (e) {}
            }, 200);
        }

        async function toggleMetronome() {
            const btn = document.getElementById('metroToggleBtn');
            const isStarting = !metronomeRunning;
            setBusy(btn, true, isStarting ? 'Starting...' : 'Stopping...');
            try {
                if (isStarting) {
                    const { bpm, vol } = getMetronomeParams();
                    await apiFetch('/metronome/start', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ bpm, vol })
                    });
                } else {
                    await apiFetch('/metronome/stop', { method: 'POST' });
                }
                metronomeRunning = isStarting;
                btn.textContent = isStarting ? 'Stop' : 'Start';
                btn.className = isStarting ? 'btn btn-danger' : 'btn btn-success';
            } finally {
                setBusy(btn, false);
            }
        }

        // Playback
        async function togglePlayback() {
            const btn = document.getElementById('playToggleBtn');
            if (!btn) return;
            
            if (playbackRunning) {
                setBusy(btn, true, 'Stopping...');
                try {
                    await apiFetch('/wav/stop', { method: 'POST' });
                } finally {
                    setBusy(btn, false);
                }
            } else {
                btn.classList.add('btn-loading');
                btn.textContent = 'Loading...';
                btn.disabled = true;
                try {
                    await apiFetch('/wav/play-queued', { method: 'POST' });
                    let attempts = 0;
                    const check = setInterval(async () => {
                        await refreshPlaybackStatus();
                        if (playbackRunning || ++attempts > 30) {
                            clearInterval(check);
                            btn.classList.remove('btn-loading');
                            btn.disabled = false;
                            updatePlaybackButton();
                        }
                    }, 1000);
                } catch (e) {
                    btn.classList.remove('btn-loading');
                    btn.disabled = false;
                    updatePlaybackButton();
                }
            }
        }

        async function refreshPlaybackStatus() {
            try {
                const res = await apiFetch('/wav/status');
                const data = await res.json();
                playbackRunning = data.running || false;
            } catch (e) {}
        }

        function updatePlaybackButton() {
            const btn = document.getElementById('playToggleBtn');
            if (!btn) return;
            if (playbackRunning) {
                btn.textContent = 'Stop Track';
                btn.className = 'btn btn-danger';
            } else {
                btn.textContent = 'Play Track';
                btn.className = 'btn btn-success';
            }
        }

        async function restartTrack() {
            try {
                const res = await apiFetch('/wav/restart', { method: 'POST' });
                const data = await res.json();
                if (!res.ok || !data.ok) {
                    alert('Restart failed: ' + (data.error || (data.upstream && data.upstream.error) || 'Unknown error'));
                }
            } catch (e) {
                alert('Restart error: ' + e);
            }
        }

        async function clearQueuedWav() {
            await apiFetch('/wav/queue', { method: 'DELETE' });
            refreshQueuedWav();
        }

        async function refreshQueuedWav() {
            try {
                const res = await apiFetch('/wav/queue');
                const data = await res.json();
                const f = (data && data.file) ? data.file : '';
                document.getElementById('queuedWavDisplay').textContent = f || '(none)';
            } catch (e) {}
        }

        // File Browser
        function isAudioFile(name) {
            return /\.(wav|mp3|ogg|flac|m4a|aac)$/i.test(name);
        }

        function getFileIcon(name) {
            if (/\.(mp3|ogg|flac|m4a|aac)$/i.test(name)) return '🎵';
            if (/\.wav$/i.test(name)) return '🔊';
            return '📄';
        }

        function prettyUploadName(name) {
            // Temp uploads are stored as: <uuid>_<original>
            // Hide the uuid prefix for readability.
            if (!name) return name;
            return name.replace(/^[0-9a-f]{32}_/i, '');
        }


        function downloadCurrentFolder() {
            const p = wavCurrentPath || 'recordings/';
            if (p === 'recordings/' || p === 'tracks/') {
                if (!confirm('Download the entire ' + p.replace('/', '') + ' library as one ZIP? This can be large.')) return;
            }
            window.location.href = '/wav/download-folder?path=' + encodeURIComponent('/' + p);
        }

        async function wavRefresh() {
            try {
                const res = await apiFetch('/wav/browse?path=' + encodeURIComponent('/' + wavCurrentPath));
                const data = await res.json();
                const filesDiv = document.getElementById('wavFiles');
                filesDiv.innerHTML = '';
                
                // Folders (hide old 'tmp' folder, only show 'temp')
                (data.dirs || []).filter(d => d !== 'tmp').forEach(d => {
                    const btn = document.createElement('div');
                    btn.className = 'file-row';
                    btn.innerHTML = '<span>📁 ' + d + '/</span>';
                    btn.style.cursor = 'pointer';
                    btn.onclick = () => {
                        wavCurrentPath = wavCurrentPath + d + '/';
                        document.getElementById('wavPath').textContent = '/' + wavCurrentPath;
                        wavRefresh();
                    };
                    filesDiv.appendChild(btn);
                });
                
                // Files
                (data.files || []).forEach(f => {
                    const row = document.createElement('div');
                    row.className = 'file-row';
                    
                    let sizeStr = '';
                    if (f.size) {
                        const mb = f.size / (1024 * 1024);
                        sizeStr = mb < 1 ? (f.size / 1024).toFixed(1) + ' KB' : mb.toFixed(1) + ' MB';
                    }
                    
                    const displayName = (wavCurrentPath.includes('recordings/temp/')) ? prettyUploadName(f.name) : f.name;
                    row.innerHTML = '<span>' + getFileIcon(f.name) + ' ' + displayName + (sizeStr ? ' <small style="opacity:0.7">(' + sizeStr + ')</small>' : '') + '</span>';
                    
                    const actions = document.createElement('div');
                    actions.className = 'file-actions';
                    
                    if (isAudioFile(f.name)) {
                        const loadBtn = document.createElement('button');
                        loadBtn.className = 'btn btn-sm btn-success';
                        loadBtn.textContent = 'Load';
                        loadBtn.onclick = async () => {
                            if (f.size && f.size > 20 * 1024 * 1024) {
                                if (!confirm('Large file (' + (f.size / (1024 * 1024)).toFixed(1) + ' MB). May take 10-30s to load. Continue?')) return;
                            }
                            await apiFetch('/wav/queue', {
                                method: 'POST',
                                headers: {'Content-Type':'application/json'},
                                body: JSON.stringify({file: wavCurrentPath + f.name})
                            });
                            refreshQueuedWav();
                        };
                        actions.appendChild(loadBtn);
                    }

                    // Download button (all file types)
                    const dlBtn = document.createElement('a');
                    dlBtn.className = 'btn btn-sm btn-info';
                    dlBtn.textContent = 'Download';
                    dlBtn.href = '/wav/download?file=' + encodeURIComponent(wavCurrentPath + f.name);
                    dlBtn.download = f.name;
                    actions.appendChild(dlBtn);
                    
                    row.appendChild(actions);
                    filesDiv.appendChild(row);
                });
            } catch (e) {
                console.error('wavRefresh error', e);
            }
        }

        function wavUp() {
            const parts = wavCurrentPath.replace(/\/$/, '').split('/').filter(Boolean);
            if (parts.length > 0) {
                parts.pop();
                wavCurrentPath = parts.length === 0 ? 'recordings/' : parts.join('/') + '/';
                if (!wavCurrentPath.startsWith('recordings/')) wavCurrentPath = 'recordings/';
            }
            document.getElementById('wavPath').textContent = '/' + wavCurrentPath;
            wavRefresh();
        }

        async function tmpTrackUpload() {
            const input = document.getElementById('tmpTrackUploadInput');
            if (!input.files || !input.files[0]) {
                alert('Please select a file first');
                return;
            }
            const file = input.files[0];
            const form = new FormData();
            form.append('file', file);
            try {
                const res = await fetch('/wav/tmp-upload', { method: 'POST', body: form });
                const data = await res.json();
                if (data.ok) {
                    alert('Uploaded: ' + data.file);
                    wavRefresh();
                } else {
                    alert('Upload failed: ' + (data.error || 'Unknown error'));
                }
            } catch (e) {
                alert('Upload error: ' + e);
            }
        }

        // Other actions
        async function restartBotJamulus() {
            if (!confirm('Restart the bot?')) return;
            try {
                await apiFetch('/bot/restart-jamulus', { method: 'POST' });
                alert('Restart requested.');
            } catch (e) {
                alert('Error.');
            }
        }

        // Status & Sessions
        async function refreshStatuses() {
            try {
                const res = await apiFetch('/get-status');
                const data = await res.json();
                
                // Recording
                if (data.recording_state && data.recording_state !== recordingState) {
                    updateRecordingButton(data.recording_state);
                }
                
                // Jamulus
                const jamStatus = document.getElementById('jamStatus');
                if (data.jamulus_running) {
                    jamStatus.textContent = 'Jamulus Server: Running';
                    jamStatus.style.background = '#5cb85c';
                } else {
                    jamStatus.textContent = 'Jamulus Server: Stopped';
                    jamStatus.style.background = '#d9534f';
                }
            } catch (e) {}
            
            // Metronome status
            try {
                const metroRes = await apiFetch('/metronome/status');
                const metroData = await metroRes.json();
                const isRunning = metroData.running || false;
                if (isRunning !== metronomeRunning) {
                    metronomeRunning = isRunning;
                    const btn = document.getElementById('metroToggleBtn');
                    if (btn) {
                        btn.textContent = isRunning ? 'Stop' : 'Start';
                        btn.className = isRunning ? 'btn btn-danger' : 'btn btn-success';
                    }
                }
            } catch (e) {}
            
            refreshPlaybackStatus();
            updatePlaybackButton();
        }

        // Init
        window.onload = function() {
            wavRefresh();
            refreshQueuedWav();
            refreshStatuses();
            setInterval(refreshStatuses, 3000);
        };
    </script>
</body>
</html>
