<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>JamBetter Ops Dashboard</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:#0e1116; color:#e7ecf3; margin:0; padding:16px; }
    h1 { margin:0 0 12px; font-size:22px; }
    .row { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
    .card { background:#161b22; border:1px solid #2a3443; border-radius:10px; padding:12px; min-width:220px; }
    .badge { padding:3px 8px; border-radius:999px; font-weight:600; }
    .green { background:#103f2a; color:#a9f5c8; }
    .yellow { background:#4a3b12; color:#ffe089; }
    .red { background:#4a1f1f; color:#ffb1b1; }
    table { width:100%; border-collapse: collapse; }
    th, td { padding:8px; border-bottom:1px solid #2a3443; text-align:left; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .muted { opacity:.75; }
    .btn { background:#2a6cf0; color:white; border:none; border-radius:8px; padding:8px 12px; cursor:pointer; }
  </style>
</head>
<body>
  <h1>JamBetter Ops Dashboard</h1>
  <div class="row" id="top"></div>
  <div class="card" style="margin-bottom:12px;">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <b>Services</b>
      <button class="btn" onclick="loadHealth()">Refresh</button>
    </div>
    <table>
      <thead><tr><th>Service</th><th>State</th></tr></thead>
      <tbody id="svc"></tbody>
    </table>
  </div>
  <div class="muted mono" id="stamp"></div>

  <script>
    function badge(grade, label){
      const cls = grade === 'green' ? 'green' : (grade === 'yellow' ? 'yellow' : 'red');
      return `<span class="badge ${cls}">${label}</span>`;
    }

    async function loadHealth(){
      const res = await fetch('/ops/health');
      const d = await res.json();
      const q = (d.quality || {});
      const load = (d.load || {});
      const disk = (d.disk || {});
      document.getElementById('top').innerHTML = `
        <div class="card">Quality<br>${badge(q.grade || 'red', q.label || 'Unknown')}</div>
        <div class="card">Load 1m<br><b>${load.load1 ?? '-'}</b> / ${load.cores ?? '-'} cores</div>
        <div class="card">Disk Used<br><b>${disk.used_pct ?? '-'}%</b> (${disk.free_gb ?? '-'} GB free)</div>
      `;
      const rows = (d.services || []).map(s => `<tr><td class="mono">${s.name}</td><td>${s.active ? '✅ active' : '❌ ' + (s.state || 'down')}</td></tr>`).join('');
      document.getElementById('svc').innerHTML = rows || '<tr><td colspan="2">No data</td></tr>';
      document.getElementById('stamp').textContent = 'Updated: ' + (d.ts || new Date().toISOString());
    }

    loadHealth();
    setInterval(loadHealth, 15000);
  </script>
</body>
</html>
