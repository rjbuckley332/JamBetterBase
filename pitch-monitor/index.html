<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>JamBetter Pitch Monitor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
  }

  #top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: #111118;
    border-bottom: 1px solid #222;
    flex-shrink: 0;
  }

  #top-bar h1 {
    font-size: 16px;
    font-weight: 600;
    color: #aaa;
  }

  #top-bar h1 span { color: #4ecdc4; }

  #start-btn {
    padding: 8px 20px;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    background: #4ecdc4;
    color: #0a0a0f;
    transition: background 0.2s;
  }

  #start-btn:hover { background: #3dbdb5; }
  #start-btn.active { background: #e74c3c; }
  #start-btn.active:hover { background: #c0392b; }

  /* ---- Big tuner readout ---- */
  #tuner {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px 0 8px;
    flex-shrink: 0;
    background: #0d0d14;
  }

  #note-name {
    font-size: 64px;
    font-weight: 700;
    letter-spacing: 2px;
    line-height: 1;
    color: #555;
    transition: color 0.15s;
  }

  #note-name.on-pitch { color: #2ecc71; }
  #note-name.near-pitch { color: #f1c40f; }
  #note-name.off-pitch { color: #e74c3c; }

  #cents-display {
    font-size: 28px;
    font-weight: 600;
    margin-top: 4px;
    color: #555;
    font-variant-numeric: tabular-nums;
  }

  #freq-display {
    font-size: 13px;
    color: #444;
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }

  /* ---- Cents meter bar ---- */
  #meter-wrap {
    width: 80%;
    max-width: 400px;
    height: 18px;
    margin: 8px auto 4px;
    position: relative;
    background: #181820;
    border-radius: 9px;
    overflow: hidden;
  }

  #meter-center {
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 2px;
    background: #444;
    transform: translateX(-1px);
    z-index: 2;
  }

  #meter-bar {
    position: absolute;
    top: 2px;
    bottom: 2px;
    width: 12px;
    border-radius: 6px;
    background: #555;
    left: 50%;
    transform: translateX(-6px);
    transition: left 0.07s linear, background 0.15s;
    z-index: 3;
  }

  #meter-labels {
    display: flex;
    justify-content: space-between;
    width: 80%;
    max-width: 400px;
    margin: 0 auto;
    font-size: 11px;
    color: #444;
  }

  /* ---- Timeline canvas ---- */
  #timeline-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #08080d;
  }

  #timeline {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ---- Settings row ---- */
  #settings {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 8px 16px;
    background: #111118;
    border-top: 1px solid #222;
    flex-shrink: 0;
    flex-wrap: wrap;
  }

  #settings label {
    font-size: 12px;
    color: #666;
  }

  #settings select, #settings input[type=range] {
    background: #1a1a24;
    color: #ccc;
    border: 1px solid #333;
    border-radius: 4px;
    padding: 3px 6px;
    font-size: 12px;
  }

  .setting-group {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  /* ---- Permissions prompt ---- */
  #permission-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    text-align: center;
    padding: 20px;
  }

  #permission-overlay.show { display: flex; }
  #permission-overlay p { font-size: 18px; color: #ccc; max-width: 360px; }
  #permission-overlay .emoji { font-size: 48px; }
</style>
</head>
<body>

<div id="permission-overlay">
  <div class="emoji">🎤</div>
  <p>Tap <strong>Start</strong> and allow microphone access to begin pitch monitoring.</p>
</div>

<div id="top-bar">
  <h1>🎤 <span>JamBetter</span> Pitch Monitor</h1>
  <button id="start-btn">Start</button>
</div>

<div id="tuner">
  <div id="note-name">—</div>
  <div id="cents-display">— ¢</div>
  <div id="freq-display">— Hz</div>
  <div id="meter-wrap">
    <div id="meter-center"></div>
    <div id="meter-bar"></div>
  </div>
  <div id="meter-labels"><span>−50¢</span><span>0</span><span>+50¢</span></div>
</div>

<div id="timeline-wrap">
  <canvas id="timeline"></canvas>
</div>

<div id="settings">
  <div class="setting-group">
    <label>Window:</label>
    <select id="window-select">
      <option value="10">10 sec</option>
      <option value="15" selected>15 sec</option>
      <option value="20">20 sec</option>
      <option value="30">30 sec</option>
    </select>
  </div>
  <div class="setting-group">
    <label>Range:</label>
    <select id="range-select">
      <option value="bass">Bass (E2–E4)</option>
      <option value="baritone">Baritone (A2–A4)</option>
      <option value="tenor" selected>Tenor (C3–C5)</option>
      <option value="alto">Alto (F3–F5)</option>
      <option value="soprano">Soprano (C4–C6)</option>
      <option value="auto">Auto</option>
    </select>
  </div>
  <div class="setting-group">
    <label>Mic Gain:</label>
    <input type="range" id="mic-gain" min="1" max="8" step="0.5" value="1">
    <span id="mic-gain-label" style="font-size:12px;color:#888;min-width:28px;">1×</span>
  </div>
  <div class="setting-group">
    <label>Sensitivity:</label>
    <input type="range" id="sensitivity" min="0.005" max="0.08" step="0.005" value="0.02">
  </div>
</div>

<script>
// ============================================================
//  YIN pitch detection (monophonic, optimized for voice)
// ============================================================
function yin(buf, sampleRate, threshold) {
  const halfLen = Math.floor(buf.length / 2);
  const yinBuf = new Float32Array(halfLen);

  // Difference function
  yinBuf[0] = 0;
  for (let tau = 1; tau < halfLen; tau++) {
    let sum = 0;
    for (let i = 0; i < halfLen; i++) {
      const d = buf[i] - buf[i + tau];
      sum += d * d;
    }
    yinBuf[tau] = sum;
  }

  // Cumulative mean normalized difference
  yinBuf[0] = 1;
  let runningSum = 0;
  for (let tau = 1; tau < halfLen; tau++) {
    runningSum += yinBuf[tau];
    yinBuf[tau] = yinBuf[tau] * tau / runningSum;
  }

  // Absolute threshold
  let tauEstimate = -1;
  for (let tau = 2; tau < halfLen; tau++) {
    if (yinBuf[tau] < threshold) {
      while (tau + 1 < halfLen && yinBuf[tau + 1] < yinBuf[tau]) tau++;
      tauEstimate = tau;
      break;
    }
  }

  if (tauEstimate === -1) return -1;

  // Parabolic interpolation for sub-sample accuracy
  const s0 = tauEstimate > 0 ? yinBuf[tauEstimate - 1] : yinBuf[tauEstimate];
  const s1 = yinBuf[tauEstimate];
  const s2 = tauEstimate + 1 < halfLen ? yinBuf[tauEstimate + 1] : yinBuf[tauEstimate];
  let betterTau = tauEstimate;
  const denom = 2 * s1 - s2 - s0;
  if (denom !== 0) {
    betterTau = tauEstimate + (s2 - s0) / (2 * denom);
  }

  return sampleRate / betterTau;
}

// ============================================================
//  Music theory helpers
// ============================================================
const NOTE_NAMES = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];

function freqToNote(freq) {
  const semitones = 12 * Math.log2(freq / 440);
  const midi = Math.round(semitones) + 69;
  const cents = Math.round((semitones - Math.round(semitones)) * 100);
  const name = NOTE_NAMES[((midi % 12) + 12) % 12];
  const octave = Math.floor(midi / 12) - 1;
  return { name, octave, midi, cents, freq };
}

function noteToFreq(midi) {
  return 440 * Math.pow(2, (midi - 69) / 12);
}

// ============================================================
//  Voice ranges (MIDI note numbers)
// ============================================================
const RANGES = {
  bass:     { lo: 40, hi: 64 },   // E2–E4
  baritone: { lo: 45, hi: 69 },   // A2–A4
  tenor:    { lo: 48, hi: 72 },   // C3–C5
  alto:     { lo: 53, hi: 77 },   // F3–F5
  soprano:  { lo: 60, hi: 84 },   // C4–C6
  auto:     { lo: 36, hi: 84 },   // C2–C6
};

// ============================================================
//  App state
// ============================================================
let audioCtx, analyser, source, stream, gainNode;
let running = false;
let pitchHistory = [];        // [{t, freq, note, cents}]
let windowSec = 15;
let range = RANGES.tenor;
let sensitivity = 0.02;       // YIN threshold (lower = pickier)
let micGain = 1;
let animFrame;

const startBtn   = document.getElementById('start-btn');
const noteNameEl  = document.getElementById('note-name');
const centsEl     = document.getElementById('cents-display');
const freqEl      = document.getElementById('freq-display');
const meterBar    = document.getElementById('meter-bar');
const canvas      = document.getElementById('timeline');
const ctx         = canvas.getContext('2d');

// ============================================================
//  Controls
// ============================================================
document.getElementById('window-select').addEventListener('change', e => {
  windowSec = parseInt(e.target.value, 10);
});

document.getElementById('range-select').addEventListener('change', e => {
  range = RANGES[e.target.value];
});

document.getElementById('sensitivity').addEventListener('input', e => {
  sensitivity = parseFloat(e.target.value);
});

document.getElementById('mic-gain').addEventListener('input', e => {
  micGain = parseFloat(e.target.value);
  document.getElementById('mic-gain-label').textContent = micGain + '×';
  if (gainNode) gainNode.gain.value = micGain;
});

// ============================================================
//  Start / Stop
// ============================================================
startBtn.addEventListener('click', async () => {
  if (running) { stop(); return; }

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false,
      }
    });
  } catch(e) {
    alert('Microphone access denied. Please allow mic access and try again.');
    return;
  }

  audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 4096;
  gainNode = audioCtx.createGain();
  gainNode.gain.value = micGain;
  source = audioCtx.createMediaStreamSource(stream);
  source.connect(gainNode);
  gainNode.connect(analyser);

  running = true;
  startBtn.textContent = 'Stop';
  startBtn.classList.add('active');
  pitchHistory = [];
  tick();
});

function stop() {
  running = false;
  startBtn.textContent = 'Start';
  startBtn.classList.remove('active');
  if (animFrame) cancelAnimationFrame(animFrame);
  if (source) source.disconnect();
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (audioCtx) audioCtx.close();
  noteNameEl.textContent = '—';
  noteNameEl.className = '';
  centsEl.textContent = '— ¢';
  freqEl.textContent = '— Hz';
  meterBar.style.left = '50%';
  meterBar.style.background = '#555';
}

// ============================================================
//  Main loop
// ============================================================
function tick() {
  if (!running) return;
  animFrame = requestAnimationFrame(tick);

  const buf = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(buf);

  // Check RMS to skip silence
  let rms = 0;
  for (let i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / buf.length);

  const now = performance.now() / 1000;

  if (rms < 0.01) {
    // Silence
    pitchHistory.push({ t: now, freq: -1, note: null, cents: 0 });
    noteNameEl.textContent = '—';
    noteNameEl.className = '';
    centsEl.textContent = '— ¢';
    freqEl.textContent = '— Hz';
    meterBar.style.left = '50%';
    meterBar.style.background = '#555';
  } else {
    const freq = yin(buf, audioCtx.sampleRate, sensitivity);
    if (freq > 0 && freq > noteToFreq(range.lo - 2) && freq < noteToFreq(range.hi + 2)) {
      const note = freqToNote(freq);
      pitchHistory.push({ t: now, freq, note: note.name + note.octave, midi: note.midi, cents: note.cents });

      // Update tuner display
      noteNameEl.textContent = note.name + note.octave;
      const absCents = Math.abs(note.cents);
      if (absCents <= 8) {
        noteNameEl.className = 'on-pitch';
        meterBar.style.background = '#2ecc71';
      } else if (absCents <= 20) {
        noteNameEl.className = 'near-pitch';
        meterBar.style.background = '#f1c40f';
      } else {
        noteNameEl.className = 'off-pitch';
        meterBar.style.background = '#e74c3c';
      }
      const sign = note.cents >= 0 ? '+' : '';
      centsEl.textContent = `${sign}${note.cents} ¢`;
      freqEl.textContent = `${freq.toFixed(1)} Hz`;

      // Meter bar position: -50 to +50 cents mapped to 0%–100%
      const pct = Math.max(0, Math.min(100, (note.cents + 50) / 100 * 100));
      meterBar.style.left = pct + '%';
    } else {
      pitchHistory.push({ t: now, freq: -1, note: null, cents: 0 });
    }
  }

  // Prune old history
  const cutoff = now - windowSec - 2;
  while (pitchHistory.length > 0 && pitchHistory[0].t < cutoff) pitchHistory.shift();

  drawTimeline(now);
}

// ============================================================
//  Timeline rendering
// ============================================================
function drawTimeline(now) {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  const w = rect.width;
  const h = rect.height;
  if (canvas.width !== w * dpr || canvas.height !== h * dpr) {
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  ctx.clearRect(0, 0, w, h);

  const loMidi = range.lo;
  const hiMidi = range.hi;
  const midiSpan = hiMidi - loMidi;
  const padLeft = 44;
  const padRight = 8;
  const plotW = w - padLeft - padRight;
  const plotH = h;

  // ---- Grid lines for each note ----
  for (let midi = loMidi; midi <= hiMidi; midi++) {
    const y = plotH - ((midi - loMidi) / midiSpan) * plotH;
    const noteName = NOTE_NAMES[((midi % 12) + 12) % 12];
    const isNatural = !noteName.includes('♯');

    // Horizontal grid line
    ctx.strokeStyle = isNatural ? '#1a1a24' : '#111118';
    ctx.lineWidth = isNatural ? 1 : 0.5;
    ctx.beginPath();
    ctx.moveTo(padLeft, y);
    ctx.lineTo(w - padRight, y);
    ctx.stroke();

    // Note label on left
    if (isNatural) {
      const octave = Math.floor(midi / 12) - 1;
      ctx.fillStyle = '#444';
      ctx.font = '11px -apple-system, system-ui, sans-serif';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillText(noteName + octave, padLeft - 6, y);
    }
  }

  // ---- Time markers ----
  const tStart = now - windowSec;
  for (let sec = Math.ceil(tStart); sec <= now; sec++) {
    const x = padLeft + ((sec - tStart) / windowSec) * plotW;
    ctx.strokeStyle = '#1a1a24';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, plotH);
    ctx.stroke();
  }

  // ---- "Now" line (right edge marker) ----
  const nowX = padLeft + plotW;
  ctx.strokeStyle = 'rgba(78, 205, 196, 0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(nowX, 0);
  ctx.lineTo(nowX, plotH);
  ctx.stroke();

  // ---- Playhead / current position indicator ----
  // Subtle glow column at the right edge
  const grad = ctx.createLinearGradient(nowX - 20, 0, nowX, 0);
  grad.addColorStop(0, 'rgba(78, 205, 196, 0)');
  grad.addColorStop(1, 'rgba(78, 205, 196, 0.05)');
  ctx.fillStyle = grad;
  ctx.fillRect(nowX - 20, 0, 20, plotH);

  // ---- Draw pitch trace ----
  if (pitchHistory.length < 2) return;

  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  let prevPoint = null;

  for (let i = 0; i < pitchHistory.length; i++) {
    const p = pitchHistory[i];
    if (p.freq <= 0 || p.midi === undefined) {
      prevPoint = null;
      continue;
    }

    const x = padLeft + ((p.t - tStart) / windowSec) * plotW;
    const y = plotH - ((p.midi + p.cents / 100 - loMidi) / midiSpan) * plotH;

    if (x < padLeft || x > w - padRight) { prevPoint = { x, y, cents: p.cents }; continue; }

    if (prevPoint) {
      const absCents = Math.abs(p.cents);
      let color;
      if (absCents <= 8) color = '#2ecc71';
      else if (absCents <= 20) color = '#f1c40f';
      else color = '#e74c3c';

      // Glow
      ctx.strokeStyle = color;
      ctx.lineWidth = 5;
      ctx.globalAlpha = 0.2;
      ctx.beginPath();
      ctx.moveTo(prevPoint.x, prevPoint.y);
      ctx.lineTo(x, y);
      ctx.stroke();

      // Core line
      ctx.lineWidth = 2.5;
      ctx.globalAlpha = 0.9;
      ctx.beginPath();
      ctx.moveTo(prevPoint.x, prevPoint.y);
      ctx.lineTo(x, y);
      ctx.stroke();

      ctx.globalAlpha = 1;
    }

    prevPoint = { x, y, cents: p.cents };
  }

  // ---- Draw dots at note centers for reference ----
  // (small dots where the pitch line crosses exact note boundaries)
}

// ============================================================
//  Resize handler
// ============================================================
window.addEventListener('resize', () => {
  if (running) drawTimeline(performance.now() / 1000);
});

// ============================================================
//  Initial state
// ============================================================
(function init() {
  // Draw empty grid
  setTimeout(() => drawTimeline(performance.now() / 1000), 100);
})();
</script>
</body>
</html>
